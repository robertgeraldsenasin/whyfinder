# Pipeline design (docs/spec/03_DATA.md). Stages whose command lands in a later milestone are listed
# as comments until then. Run everything with `uv run dvc repro`; data.yml runs it on GitHub's runners.
stages:
  fetch:
    cmd: uv run whyfinder data fetch --out data/raw
    deps: [data/checksums.txt, src/whyfinder/data/fetch.py, src/whyfinder/data/sources.py]
    outs:
      - data/raw: {persist: true, cache: false}  # verified in place; never deleted or re-downloaded
  parse:
    cmd: uv run whyfinder data parse --workers 4
    deps: [data/raw, src/whyfinder/data/parse.py]
    params: [data.parse_tolerance]
    outs: [data/interim]
  clean:
    cmd: uv run whyfinder data clean
    deps: [data/interim, src/whyfinder/data/clean.py, src/whyfinder/data/contracts.py]
    params: [data.user_salt, data.hours_clip_quantile]
    outs: [data/processed/interactions_clean.parquet, data/processed/games.parquet, data/processed/clean_stats.json]
  kcore:
    cmd: uv run whyfinder data kcore
    deps: [data/processed/interactions_clean.parquet, src/whyfinder/data/kcore.py]
    params: [data.kcore]
    outs: [data/processed/interactions.parquet, data/processed/kcore_stats.json]
  split:
    cmd: uv run whyfinder data split
    deps: [data/processed/interactions.parquet, src/whyfinder/data/split.py]
    params: [split]
    outs:
      - data/processed/train.parquet
      - data/processed/valid.parquet
      - data/processed/test.parquet
      - data/processed/cold.parquet
      - data/split.json: {cache: false}
  features:
    cmd: uv run whyfinder data features
    deps: [data/processed/train.parquet, src/whyfinder/data/features.py]
    params: [data.item_cap, data.confidence]
    outs: [data/processed/X_train.npz, data/processed/items.parquet, data/processed/users.parquet, data/processed/features_stats.json]
  subsample:
    cmd: uv run whyfinder data subsample
    deps: [data/processed/train.parquet, data/processed/valid.parquet, data/processed/test.parquet, data/processed/cold.parquet, data/processed/games.parquet, src/whyfinder/data/subsample.py]
    params: [data.ci_user_fraction]
    outs: [data/ci]
  stats:
    cmd: uv run whyfinder data stats
    deps: [data/interim/parse_stats.json, data/processed/clean_stats.json, data/processed/kcore_stats.json, data/split.json, data/processed/features_stats.json, data/ci/manifest.json]
    outs:
      - data/stats.json: {cache: false}
  export_demo:
    cmd: uv run whyfinder export demo
    deps: [data/processed/train.parquet, data/processed/games.parquet, data/split.json, src/whyfinder/export/demo.py]
    params: [demo, graph.tags_per_game]
    outs:
      - data/export/demo-slice.json: {cache: false}
  export_reviews:
    cmd: uv run whyfinder export reviews
    deps: [data/interim/reviews.parquet, data/interim/review_text.parquet, data/export/demo-slice.json, data/split.json, src/whyfinder/export/reviews.py]
    params: [demo.quotes_per_game, demo.terms_per_game, demo.reviews_per_game, data.user_salt]
    outs:
      - data/export/reviews.json: {cache: false}
  # build:    (M1) uv run whyfinder build ease graph blend ials
  # index:    (M3) uv run whyfinder index reviews
  # eval:     (M1) uv run whyfinder eval --split valid   metrics: results/valid.json
