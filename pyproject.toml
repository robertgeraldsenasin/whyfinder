[project]
name = "whyfinder"
version = "0.2.0"
description = "Find your next game. Know why. An explainable Steam game recommender with exact attributions, grounded RAG and statistical CI gates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Robert Gerald Senasin", email = "robertgeraldsenasin@gmail.com" }]
keywords = ["recommender-systems", "explainable-ai", "rag", "ease", "personalized-pagerank", "dpp"]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17",
  "typer>=0.12",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "pandera>=0.21",
]

# Added in later milestones (see docs/plan/ROADMAP.md):
#   M0: pandera, dvc, requests      M1: dev oracles: implicit
#   M3: sentence-transformers (or onnxruntime), ollama client; dev oracles: hnswlib, rank-bm25
#   M4: the `serve` group (fastapi, uvicorn); httpx and schemathesis test it (dev)

[project.scripts]
whyfinder = "whyfinder.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pandas-stubs>=2.2",
  "scipy-stubs>=1.14",
  "types-pyyaml>=6.0",
  "httpx>=0.27",
  "schemathesis>=4.0",
]
pipeline = [
    "dvc>=3.55",
]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whyfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT", "NPY", "PERF", "S"]
# S101: assert is fine in tests. N803/N806/N815: matrices and constants keep their math names (X, B, c_B).
ignore = ["S101", "N803", "N806", "N815"]
# Docstrings and messages use the notation of docs/spec/04_ALGORITHMS.md.
allowed-confusables = ["×", "α", "β", "γ", "ε", "θ", "λ", "π", "Π", "–", "−", "·", "∈", "ŝ", "∪"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603", "S607"]  # gh is called on purpose
"tests/*" = ["S311"]  # seeded test data, not cryptography

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["whyfinder"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests (skipped in the default CI job)"]

[tool.coverage.run]
source = ["whyfinder"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "whyfinder"

[[tool.importlinter.contracts]]
name = "Layers: serve on top, core at the bottom"
type = "layers"
layers = [
  "whyfinder.cli",
  "whyfinder.serve",
  "whyfinder.eval | whyfinder.export",
  "whyfinder.rag",
  "whyfinder.explain",
  "whyfinder.rerank",
  "whyfinder.graph",
  "whyfinder.core",
  "whyfinder.data",
]

[[tool.importlinter.contracts]]
name = "core depends on nothing else in whyfinder"
type = "forbidden"
source_modules = ["whyfinder.core"]
forbidden_modules = ["whyfinder.data", "whyfinder.graph", "whyfinder.rerank", "whyfinder.explain", "whyfinder.rag", "whyfinder.eval", "whyfinder.export", "whyfinder.serve"]

[[tool.importlinter.contracts]]
name = "Nothing imports serve"
type = "forbidden"
source_modules = ["whyfinder.data", "whyfinder.core", "whyfinder.graph", "whyfinder.rerank", "whyfinder.explain", "whyfinder.rag", "whyfinder.eval", "whyfinder.export"]
forbidden_modules = ["whyfinder.serve"]
