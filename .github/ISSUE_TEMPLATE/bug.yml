name: Bug
description: Something is wrong
labels: ["type:fix"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Commit, data version and seed
