# Enabled in M1: replace `on: workflow_dispatch` with the schedule below.
name: nightly

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 19 * * *"   # 03:17 Manila

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Dependency audit
        run: uvx pip-audit --strict || true   # becomes blocking in M1
      - name: Validation report and iALS stability over 3 seeds
        run: echo "TODO(M1) uv run whyfinder eval --split valid --seeds 3"
