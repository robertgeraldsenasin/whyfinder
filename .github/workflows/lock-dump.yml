# Temporary, for this branch only: resolves uv.lock on a runner and prints it for review.
name: lock-dump
on:
  pull_request:
    paths: ['pyproject.toml', '.github/workflows/lock-dump.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock
      - run: git diff --stat uv.lock
      - name: Dump
        run: |
          gzip -9 -c uv.lock > /tmp/uv.lock.gz
          echo "LOCK-BEGIN"
          base64 -w 0 /tmp/uv.lock.gz | fold -w 3000
          echo
          echo "LOCK-END"
