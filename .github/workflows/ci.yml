name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group dev --group serve
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: README tables match results/
        run: uv run python scripts/gen_readme_tables.py --check
      - name: OpenAPI document matches the code
        run: uv run whyfinder serve openapi --check
      - name: Grounded generation replays its cache (ADR-0009)
        run: |
          for model in qwen2.5:1.5b qwen2.5:3b llama3.2:3b llama3.1:8b qwen2.5:7b; do
            uv run whyfinder rag eval --mode replay --model "$model" --check
          done
      - name: Coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Keep the build (for reviewing a branch without deploying it)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 5
      - name: Types and Svelte checks
        run: npm run check
      - name: Golden cross-check (the browser engine must equal the Python core)
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility (Playwright + axe, both themes, desktop and phone)
        run: npm run e2e
      - name: Screenshots of every view, desktop and phone
        if: success() || failure()
        run: npm run screens
      - name: Keep the screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: web/screens/
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  api:
    name: api image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/whyfinder-api
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f docker/Dockerfile.api --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" .
      - name: Smoke test (health, version, a recommendation, an explanation, a problem)
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 150); do curl -fs localhost:8000/healthz && break; sleep 1; done
          echo
          curl -fs localhost:8000/version | tee /tmp/version.json
          jq -e --arg sha "${{ github.sha }}" '.git_sha == $sha' /tmp/version.json
          curl -fs -X POST localhost:8000/recommend -H 'content-type: application/json' \
            -d '{"liked_game_ids": ["620", "49520", "500"], "k": 3}' | tee /tmp/rec.json
          jq -e '.items | length == 3' /tmp/rec.json
          pick=$(jq -r '.items[0].game_id' /tmp/rec.json)
          curl -fs -X POST localhost:8000/explain -H 'content-type: application/json' \
            -d "{\"liked_game_ids\": [\"620\", \"49520\", \"500\"], \"game_id\": \"$pick\"}" | tee /tmp/explain.json
          jq -e '.checker.passed and (.attributions | length == 3)' /tmp/explain.json
          curl -fs 'localhost:8000/reviews?q=co-op%20with%20friends&k=3' | tee /tmp/reviews.json
          jq -e '.items | length == 3' /tmp/reviews.json
          curl -fs localhost:8000/healthz | jq -e '.index == "ok"'
          code=$(curl -s -o /tmp/problem.json -w '%{http_code}' -X POST localhost:8000/recommend \
            -H 'content-type: application/json' -d '{"liked_game_ids": ["1"]}')
          test "$code" = 404
          jq -e '.status == 404' /tmp/problem.json
      - name: Server log
        if: always()
        run: docker logs api || true
      - name: Publish to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
