# Tags a milestone release on main and publishes its notes from CHANGELOG.md. Manual only:
# Actions → tag → Run workflow → version (e.g. 0.1.0). The tag is annotated and signed off as the owner.
name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (e.g. 0.1.0); needs a "## [version]" section in CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check the version and take its notes from CHANGELOG.md
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::v$VERSION already exists"; exit 1; fi
          grep -q "^version = \"$VERSION\"" pyproject.toml || echo "::warning::pyproject.toml has a different version"
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on = 1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::no '## [$VERSION]' section in CHANGELOG.md"; exit 1; }
          cat notes.md
      - name: Tag main
        run: |
          git config user.name "Robert Gerald Senasin"
          git config user.email "robertgeraldsenasin@gmail.com"
          { echo "v$VERSION"; echo; cat notes.md; } > message.txt
          git tag -a "v$VERSION" -F message.txt
          git push origin "v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
