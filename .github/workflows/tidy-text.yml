# Keeps issue, pull request and comment text exactly as the owner wrote it: some API clients append a
# trailing "Generated by [tool](link)" footer. This removes that footer from text written by the
# repository owner, as it arrives, and on demand over the whole repository.
name: tidy-text

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const footer = /\n*(?:-{3,}[ \t]*\n)?[ \t]*_?(?:\p{Extended_Pictographic}\s*)?Generated (?:by|with) \[[^\]\n]+\]\([^)\n]*\)_?\s*$/iu;
            const strip = (text) => (text ?? '').replace(footer, '').trimEnd();
            const { owner, repo } = context.repo;
            const ownerLogin = context.payload.repository.owner.login;
            let changed = 0;
            const fixIssue = async (number, body) => {
              if (body && footer.test(body)) {
                await github.rest.issues.update({ owner, repo, issue_number: number, body: strip(body) });
                changed++;
              }
            };
            const fixComment = async (id, body) => {
              if (body && footer.test(body)) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: id, body: strip(body) });
                changed++;
              }
            };
            if (context.eventName === 'workflow_dispatch') {
              const items = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
              for (const item of items) if (item.user?.login === ownerLogin) await fixIssue(item.number, item.body);
              const comments = await github.paginate(github.rest.issues.listCommentsForRepo, { owner, repo, per_page: 100 });
              for (const c of comments) if (c.user?.login === ownerLogin) await fixComment(c.id, c.body);
            } else if (context.eventName === 'issue_comment') {
              await fixComment(context.payload.comment.id, context.payload.comment.body);
            } else {
              const item = context.payload.issue ?? context.payload.pull_request;
              await fixIssue(item.number, item.body);
            }
            core.info(`tidied ${changed} item(s)`);
