# A tagged release scores the sealed test set, the only place it is ever read (ADR-0005). It runs the
# data pipeline on the full raw files, evaluates every model on the test users, writes results/ and
# attaches everything to the GitHub release. Committing results/ (and regenerating the README table
# from it) is then an ordinary PR.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group pipeline
      - name: Fetch raw files (checksums verified)
        run: uv run whyfinder data fetch
      - name: Data pipeline up to the split and features
        run: uv run dvc repro features
      - name: Score the sealed test set (warm and cold-start users)
        env:
          WHYFINDER_RELEASE: "1"
        run: |
          mkdir -p dist
          uv run whyfinder eval --data data/processed --split test --out dist/eval-test.json
          uv run whyfinder eval --data data/processed --split cold-test --models popularity,itemknn,ease,blend,whyfinder --out dist/eval-cold-test.json
      - name: Results and README table
        run: |
          uv run whyfinder results --report dist/eval-test.json --out results
          uv run python scripts/gen_readme_tables.py
          cp results/*.json dist/
          {
            echo "## Sealed test set"
            sed -n '/<!-- results:start -->/,/<!-- results:end -->/p' README.md
          } >> "$GITHUB_STEP_SUMMARY"
          for f in results/*.json; do echo "== $f"; cat "$f"; done
      - name: Attach to the GitHub release
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="results-$(date -u +%Y%m%d-%H%M)"; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes-file <(sed -n "/^## \[${tag#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d') --verify-tag || \
            gh release create "$tag" --title "$tag" --notes "Sealed test-set results for $tag."
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$tag" dist/* --clobber
