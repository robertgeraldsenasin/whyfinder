# A release scores the sealed test set, the only place it is ever read (ADR-0005). It starts from a
# pushed v* tag, or from a dispatch whose `tag` input names the release to create on that commit.
# It runs the data pipeline on the full raw files, evaluates every model on the test users, writes
# results/ and attaches everything to the GitHub release. Committing results/ (and regenerating the
# README tables from it) is then an ordinary PR.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the dispatched commit, e.g. v0.2.0 (empty: a dated results release)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group pipeline
      - name: Fetch raw files (checksums verified)
        run: uv run whyfinder data fetch
      - name: Data pipeline up to the split and features
        run: uv run dvc repro features
      - name: Score the sealed test set (warm and cold-start users)
        env:
          WHYFINDER_RELEASE: "1"
        run: |
          mkdir -p dist
          uv run whyfinder eval --data data/processed --split test --out dist/eval-test.json
          uv run whyfinder eval --data data/processed --split cold-test --models popularity,itemknn,ease,blend,whyfinder --out dist/eval-cold-test.json
      - name: Results and README table
        run: |
          uv run whyfinder results --report dist/eval-test.json --out results
          uv run python scripts/gen_readme_tables.py
          cp results/*.json dist/
          cp results/targets/test.json dist/targets-test.json
          {
            echo "## Sealed test set"
            sed -n '/<!-- results:start -->/,/<!-- targets:end -->/p' README.md
          } >> "$GITHUB_STEP_SUMMARY"
          for f in results/*.json results/targets/test.json; do echo "== $f"; cat "$f"; done
      - name: Attach to the GitHub release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="${INPUT_TAG:-results-$(date -u +%Y%m%d-%H%M)}"; fi
          sed -n "/^## \[${tag#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > notes.md
          [ -s notes.md ] || echo "Sealed test-set results for $tag." > notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # On a tag push the tag exists; on dispatch, --target creates it on the dispatched commit.
            gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$tag" dist/* --clobber
      - name: Tag the API image with the version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/whyfinder-api
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="${INPUT_TAG}"; fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Not a version release; the image keeps its commit tag only."; exit 0 ;;
          esac
          echo "$TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          # ci.yml publishes the image for each commit on main; wait for it if it is still building.
          for i in $(seq 1 40); do
            docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" >/dev/null 2>&1 && break
            [ "$i" = 40 ] && { echo "::error::$IMAGE:${GITHUB_SHA} was never published"; exit 1; }
            echo "Waiting for $IMAGE:${GITHUB_SHA} from ci.yml"; sleep 30
          done
          docker buildx imagetools create -t "$IMAGE:${tag#v}" "$IMAGE:${GITHUB_SHA}"
          echo "Tagged $IMAGE:${tag#v}" >> "$GITHUB_STEP_SUMMARY"
