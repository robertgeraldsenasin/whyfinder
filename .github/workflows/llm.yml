# Grounded generation with a local model (ADR-0009; docs/spec/06_RAG.md). Installs Ollama, pulls an
# open instruct model and the entailment judge, explains the evaluation sample through the
# generate-check-retry-fallback path and writes the faithfulness report. The cache and the report
# are printed so they can be committed; CI then replays the cache and never calls a model. Jobs
# share the judge's labels for the template control, so merge the caches and replay the reports
# locally before committing.
name: llm

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Ollama models, as a JSON list"
        default: '["qwen2.5:1.5b", "qwen2.5:3b", "llama3.2:3b", "llama3.1:8b", "qwen2.5:7b"]'
      judges:
        description: "Ollama models that label entailment, comma-separated"
        default: "qwen2.5:7b"
      cases:
        description: "Picks to explain"
        default: "60"

permissions:
  contents: read

concurrency:
  group: llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fill:
    runs-on: ubuntu-latest
    # 7-8B models on a 4-core runner take about three hours for 60 picks.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["qwen2.5:1.5b", "qwen2.5:3b", "llama3.2:3b", "llama3.1:8b", "qwen2.5:7b"]') }}
    env:
      MODEL: ${{ matrix.model }}
      JUDGES: ${{ inputs.judges || 'qwen2.5:7b' }}
      CASES: ${{ inputs.cases || '60' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ollama and the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fs localhost:11434/api/tags >/dev/null; then (ollama serve > ollama.log 2>&1 &); fi
          for i in $(seq 1 60); do curl -fs localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$MODEL"
          for judge in ${JUDGES//,/ }; do ollama pull "$judge"; done
          ollama list
      - name: Explain the sample and measure faithfulness
        run: uv run whyfinder rag eval --mode fill --model "$MODEL" --judges "$JUDGES" --cases "$CASES"
      - name: Report
        if: always()
        run: |
          { echo "## Grounded generation: $MODEL"; echo '```json'; cat results/validation/rag-eval-*.json || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "LLM-BEGIN"
          tar czf - data/llm/cache.jsonl results/validation/rag-eval-*.json | base64 -w 3000
          echo "LLM-END"
