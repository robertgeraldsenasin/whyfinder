# Grounded generation with a local model (ADR-0009; docs/spec/06_RAG.md). Installs Ollama, pulls a
# small open instruct model, explains the evaluation sample through the generate-check-retry-
# fallback path and writes the faithfulness report. The generation cache and the report are printed
# so they can be committed; CI then replays the cache and never calls a model.
name: llm

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Ollama models, as a JSON list"
        default: '["qwen2.5:1.5b", "qwen2.5:3b", "llama3.2:3b"]'
      cases:
        description: "Picks to explain"
        default: "60"

permissions:
  contents: read

concurrency:
  group: llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["qwen2.5:1.5b", "qwen2.5:3b", "llama3.2:3b"]') }}
    env:
      MODEL: ${{ matrix.model }}
      CASES: ${{ inputs.cases || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ollama and the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fs localhost:11434/api/tags >/dev/null; then (ollama serve > ollama.log 2>&1 &); fi
          for i in $(seq 1 60); do curl -fs localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$MODEL"
          ollama list
      - name: Explain the sample and measure faithfulness
        run: uv run whyfinder rag eval --mode fill --model "$MODEL" --cases "$CASES"
      - name: Report
        if: always()
        run: |
          { echo "## Grounded generation: $MODEL"; echo '```json'; cat results/validation/rag-eval-*.json || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "LLM-BEGIN"
          tar czf - data/llm/cache.jsonl results/validation/rag-eval-*.json | base64 -w 3000
          echo "LLM-END"
