# Every tunable lives here; DVC tracks it. Values are starting points (docs/spec/04_ALGORITHMS.md).
seed: 20261117
data:
  kcore: 5
  item_cap: 8000          # ADR-0004
  ci_user_fraction: 0.05
  confidence: {alpha: 1.0, eps: 1.0}
  user_salt: whyfinder-v1 # pseudonymises usernames (NFR-07); public on purpose: the raw data is public
  hours_clip_quantile: 0.999
  parse_tolerance: 0.001  # malformed-line share that fails the parse
split:                    # ADR-0002
  valid_quantile: 0.8     # T1: 80% of dated interactions fall before it
  test_quantile: 0.9      # T2
  cold_max_train_items: 4 # users with 1-4 train items form the cold-start set
  max_missing_date: 0.10  # above this, fall back to leave-last-out
ease:
  lambda: 500.0
demo:                     # ADR-0015: the slice the browser engine runs on
  games: 500
  layout_neighbors: 10
  layout_iterations: 400
  quotes_per_game: 12     # review evidence: sentences of at most 25 words (NFR-07)
  terms_per_game: 30
  reviews_per_game: 4000  # read at most this many reviews per game (smallest IDs)
graph:
  restart_alpha: 0.15
  push_eps: 1.0e-6
  top_m: 200
  tags_per_game: 20
  coplay_per_game: 20
  weights: {tag: 1.0, developer: 1.0, publisher: 0.5, coplay: 1.0}
blend:
  beta: 0.25              # tuned on validation (results/tune-valid.json)
  top_k_per_row: 500
dpp:
  candidates: 100
  theta: 1.0               # most variety within the NDCG budget (grid edge)
knn:                      # item-kNN baseline (FR-04)
  shrinkage: 50.0
  top_k: 100
ials:
  factors: 64
  reg: 0.1
  alpha: 5.0
  sweeps: 15
  solver: cg              # cg (batched, warm-started) or cholesky (exact, row by row)
  cg_steps: 3
rag:
  reviews_per_game: 20
  chunk_words: 100
  chunk_overlap: 20
  bm25: {k1: 1.2, b: 0.75}
  lsa: {dim: 128, min_df: 2}  # ADR-0010: latent semantic analysis as the dense side
  hnsw: {M: 16, ef_construction: 200, ef_search: 64}
  rrf_k: 60
tune:                     # fixed-budget grids searched on validation by `whyfinder tune`
  ease_lambda: [100, 250, 500, 1000, 2000, 4000]
  knn_shrinkage: [0, 10, 50, 200]
  ials_reg: [0.1, 1.0, 10.0]
  ials_alpha: [1.0, 5.0, 20.0]
  blend_beta: [0.0, 0.25, 0.5, 0.75, 1.0]
  dpp_theta: [1.0, 2.0, 3.0, 4.0, 6.0]
  dpp_ndcg_budget: 0.005  # θ may cost at most this much NDCG@10 against the blend by score
  max_users: 5000
eval:
  k: 10
  bootstrap_resamples: 2000
  max_users: 20000        # held-out users scored per run (ascending ID: an unbiased sample)
  ci_item_cap: 2000       # item cap for the PR gate on the CI subsample (keeps it fast)
  margins: {ndcg_at_10: 0.005, recall_at_20: 0.005, ild_at_10: 0.01}
  explain:                # explanation checks on each user's first pick (05_EXPLAINABILITY.md)
    users: 1000           # at 300 the deletion test's 95% interval (±0.023) was wider than its margin
    pool: 8               # exact counterfactuals search the 8 largest contributors, size ≤ 3
    deletion_draws: 5
  explain_margins: {deletion: 0.02, minimality_gap: 0.1}
